# created-by: streamlit-in-workspaces; skill-version=1.0.0
definition_version: 2

entities:
  data_quality_monitor:
    type: streamlit
    title: Data Quality Monitor
    query_warehouse: DQ_WH
    runtime_name: SYSTEM$ST_CONTAINER_RUNTIME_PY3_11
    compute_pool: SYSTEM_COMPUTE_POOL_CPU
    main_file: streamlit_app.py
    # pyproject.toml is required by the Workspaces runner. It only lists streamlit; without
    # an External Access Integration the runtime falls back to its pre-installed Streamlit.
    artifacts:
      - pyproject.toml
      - streamlit_app.py
      - lib/__init__.py
      - lib/db.py
      - lib/ui.py
      - lib/rules_sql.py
      - app_pages/__init__.py
      - app_pages/overview.py
      - app_pages/table_health.py
      - app_pages/run_history.py
      - app_pages/rules.py
      - app_pages/native_dmfs.py
      - app_pages/schema_explorer.py
      - app_pages/alerting.py
      - .streamlit/config.toml
      - static/Inter-Regular.ttf
      - static/Inter-Medium.ttf
      - static/Inter-SemiBold.ttf
      - static/Inter-Bold.ttf
      - static/JetBrainsMono-Regular.ttf
      - static/JetBrainsMono-Medium.ttf
